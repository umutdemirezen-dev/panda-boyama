name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Paketleri kur
        run: npm install

      - name: Android projesini olustur
        run: npx cap add android

      - name: Yatay ekran ve Tam Ekran ayari
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="landscape" android:theme="@android:style\/Theme.NoTitleBar.Fullscreen"/' android/app/src/main/AndroidManifest.xml

      - name: Oyunu Android'e kopyala
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: panda-boyama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
